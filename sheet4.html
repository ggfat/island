<!doctype html><html><body style="margin:0;background:#cde"><script type="module">
import * as THREE from "three";import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
const names=location.hash.slice(1).split(",");const S=220;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(4*S,names.length*S);r.setScissorTest(true);document.body.appendChild(r.domElement);
const L=new GLTFLoader();const out=[];
for(let i=0;i<names.length;i++){const g=await new Promise(res=>L.load(names[i],res,undefined,()=>res(null)));if(!g)continue;
 const s=new THREE.Scene();s.background=new THREE.Color("#cde");s.add(new THREE.HemisphereLight("#fff","#889",2.4));s.add(g.scene);
 const bb=new THREE.Box3().setFromObject(g.scene);const sz=bb.getSize(new THREE.Vector3()),c=bb.getCenter(new THREE.Vector3());
 out.push(`${names[i].split('/').pop()} x ${bb.min.x.toFixed(2)}..${bb.max.x.toFixed(2)} y ${bb.min.y.toFixed(2)}..${bb.max.y.toFixed(2)} z ${bb.min.z.toFixed(2)}..${bb.max.z.toFixed(2)}`);
 const m=Math.max(sz.x,sz.y,sz.z);
 [[0,1],[1,0],[0,-1],[-1,0]].forEach(([x,z],v)=>{const cam=new THREE.PerspectiveCamera(40,1,0.01,500);cam.position.set(c.x+x*m*1.6,c.y+m*0.3,c.z+z*m*1.6);cam.lookAt(c);
 const X=v*S,Y=(names.length-1-i)*S;r.setViewport(X,Y,S,S);r.setScissor(X,Y,S,S);r.render(s,cam);});}
window.out=out;window.done=1;</script></body></html>
